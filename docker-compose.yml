version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: comptime-db
    restart: always
    environment:
      POSTGRES_DB: comptime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comptime"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: comptime-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/comptime
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
